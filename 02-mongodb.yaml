apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
  namespace: roboshop
spec:
  podSelector:
    matchLabels:
      project: roboshop
      tier: database
      components: mongodb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          project: roboshop
          tier: database
          components: catalogue
    - podSelector:
        matchLabels:
          project: roboshop
          tier: database
          components: cart
    ports:
    - protocol: TCP
      port: 27017
 
